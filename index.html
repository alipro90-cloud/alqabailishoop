<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4e5f">
<title>القبائلي للامونيوم ومستلزماته</title>
<style>
:root{
  --bg:#e9eae6; --paper:#f8f8f5; --ink:#1f2a30; --mute:#66727a;
  --main:#1d4e5f; --main-ink:#fff; --due:#b5442e; --ok:#2f7a4f; --line:#cfd2cc; --gray:#d9dbd6; --grid:#8d948f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;font-size:16px}
body{padding-bottom:84px}
header{background:var(--main);color:var(--main-ink);text-align:center;padding:14px 16px 12px;
  position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;font-weight:700}
header small{opacity:.8;font-size:13px}
main{padding:14px;max-width:640px;margin:0 auto}
section{display:none}
section.on{display:block}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:8px;padding:11px 10px;min-height:46px}
input:focus{outline:3px solid #7fb0c0;border-color:var(--main)}
